name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Upstream pin matches the submodule
        run: node scripts/upstream-pin.mjs check

      - name: Install dependencies
        working-directory: mobile
        run: |
          npm ci
          node ../scripts/link-upstream-modules.mjs

      - name: Typecheck (bridge vs upstream types)
        working-directory: mobile
        run: npx tsc --noEmit -p .

      - name: Unit tests
        working-directory: mobile
        run: npx vitest run

      - name: Build the web bundle
        working-directory: mobile
        run: npx vite build

      - name: Sync Capacitor and build the debug APK
        working-directory: mobile
        env:
          HERMES_MOBILE_WEBVIEW_DEBUG: "1"
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Name the APK
        id: apk
        run: |
          version="$(node -p "require('./mobile/package.json').version")"
          mkdir -p dist-apk
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist-apk/mono-hermes-${version}-debug.apk"
          echo "name=mono-hermes-${version}-debug" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  # Bridge <-> real gateway end-to-end suite. It needs a throwaway Hermes install, which is built
  # from the pinned upstream commit with upstream's own installer.
  e2e:
    name: E2E against a throwaway hermes serve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install the pinned Hermes
        run: |
          eval "$(node scripts/upstream-pin.mjs print --env)"
          bash upstream/scripts/install.sh --commit "$HERMES_PINNED_COMMIT" --non-interactive \
            --skip-browser --skip-computer-use --hermes-home "$HOME/.hermes"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "HERMES_BIN=$HOME/.local/bin/hermes" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: mobile
        run: |
          npm ci
          node ../scripts/link-upstream-modules.mjs

      - name: E2E suite
        working-directory: mobile
        run: npx vitest run --config vitest.e2e.config.ts

      - name: Server log (on failure)
        if: failure()
        run: tail -n 80 .cache/hm/serve.log || true

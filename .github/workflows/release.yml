name: Release

on:
  push:
    tags: ["v*"]

# The job only needs to create a GitHub Release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Tag matches mobile/package.json and the upstream pin matches the submodule
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./mobile/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match mobile/package.json version $version" >&2
            exit 1
          fi
          node scripts/upstream-pin.mjs check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install dependencies
        working-directory: mobile
        run: |
          npm ci
          node ../scripts/link-upstream-modules.mjs

      - name: Typecheck and unit tests
        working-directory: mobile
        run: |
          npx tsc --noEmit -p .
          npx vitest run

      - name: Build the web bundle
        working-directory: mobile
        run: |
          npx vite build
          npx cap sync android

      - name: Decode the signing keystore (temporary file, never committed)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Repository secret ANDROID_KEYSTORE_BASE64 is not set; refusing to publish an unsigned release." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/mono-hermes-release.jks"
          (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore")
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # The alias is not a credential: a repository variable keeps it from masking
          # "mono-hermes" in every log line, as a secret would.
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'mono-hermes' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: Verify the signature and name the artifacts
        id: apk
        run: |
          version="$(node -p "require('./mobile/package.json').version")"
          name="mono-hermes-${version}-release.apk"
          mkdir -p dist-apk
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "dist-apk/$name"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$apksigner" verify --print-certs "dist-apk/$name"
          (cd dist-apk && sha256sum "$name" > "$name.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mono-hermes-release.jks"

      - name: Render the release notes
        env:
          APK_NAME: ${{ steps.apk.outputs.name }}
          VERSION: ${{ steps.apk.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # export so the node renderer below sees the pin values
          set -a
          eval "$(node scripts/upstream-pin.mjs print --env)"
          set +a
          sha256="$(cut -d' ' -f1 "dist-apk/$APK_NAME.sha256")"
          # Optional human-written notes live in docs/release-notes/<version>.md
          notes="See the commit history for details."
          if [ -f "docs/release-notes/$VERSION.md" ]; then notes="$(cat "docs/release-notes/$VERSION.md")"; fi
          NOTES="$notes" SHA256="$sha256" node -e '
            const fs = require("fs")
            const values = {
              VERSION: process.env.VERSION,
              HERMES_VERSION: process.env.HERMES_PINNED_VERSION,
              HERMES_COMMIT: process.env.HERMES_PINNED_COMMIT,
              HERMES_COMMIT_SHORT: process.env.HERMES_PINNED_COMMIT.slice(0, 7),
              APK_NAME: process.env.APK_NAME,
              SHA256: process.env.SHA256,
              REPOSITORY: process.env.REPOSITORY,
              NOTES: process.env.NOTES
            }
            const text = fs.readFileSync(".github/release-template.md", "utf8")
            fs.writeFileSync("release-body.md", text.replace(/@([A-Z0-9_]+)@/g, (m, k) => values[k] ?? m))
          '

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.apk.outputs.version }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}" --verify-tag \
            --title "Mono Hermes $VERSION" --notes-file release-body.md \
            "dist-apk/$APK_NAME" "dist-apk/$APK_NAME.sha256"
